<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時銷售多元分析看板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; padding: 20px; color: #334155; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; color: #1e293b; }
        .debug-box { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 12px; margin-bottom: 20px; font-size: 14px; font-family: monospace; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 即時銷售多元分析看板 (4大圖表 RWD)</h1>
        <div class="debug-box" id="debugInfo">正在讀取數據...</div>
        <div class="grid">
            <div class="card">
                <h3>📈 銷售趨勢分析 (折線圖)</h3>
                <canvas id="lineChart"></canvas>
            </div>
            <div class="card">
                <h3>📊 個別交易數量 (長條圖)</h3>
                <canvas id="barChart"></canvas>
            </div>
            <div class="card">
                <h3>🍩 銷售管道占比 (圓餅/甜甜圈圖)</h3>
                <canvas id="doughnutChart"></canvas>
            </div>
            <div class="card">
                <h3>🏷️ 產品類別銷量 (橫向/極區圖)</h3>
                <canvas id="categoryChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        try {
            const trendData = [{"sale_id": 1, "sale_date": "2026-09-01", "product_id": 1, "product_name": "無線滑鼠", "category": "電腦周邊", "channel": "實體門市", "unit_price": 500, "quantity": 10, "returned_quantity": 0}, {"sale_id": 2, "sale_date": "2026-09-01", "product_id": 2, "product_name": "機械鍵盤", "category": "電腦周邊", "channel": "校園團購", "unit_price": 1200, "quantity": 3, "returned_quantity": 0}, {"sale_id": 3, "sale_date": "2026-09-01", "product_id": 3, "product_name": "USB集線器", "category": "電腦周邊", "channel": "網路商店", "unit_price": 650, "quantity": 14, "returned_quantity": 0}, {"sale_id": 4, "sale_date": "2026-09-01", "product_id": 4, "product_name": "藍牙耳機", "category": "影音設備", "channel": "實體門市", "unit_price": 1800, "quantity": 7, "returned_quantity": 0}, {"sale_id": 5, "sale_date": "2026-09-01", "product_id": 5, "product_name": "藍牙喇叭", "category": "影音設備", "channel": "校園團購", "unit_price": 1500, "quantity": 18, "returned_quantity": 0}, {"sale_id": 6, "sale_date": "2026-09-01", "product_id": 6, "product_name": "網路攝影機", "category": "影音設備", "channel": "網路商店", "unit_price": 1100, "quantity": 11, "returned_quantity": 0}, {"sale_id": 7, "sale_date": "2026-09-01", "product_id": 7, "product_name": "行動電源", "category": "行動配件", "channel": "實體門市", "unit_price": 900, "quantity": 4, "returned_quantity": 0}, {"sale_id": 8, "sale_date": "2026-09-01", "product_id": 8, "product_name": "手機支架", "category": "行動配件", "channel": "校園團購", "unit_price": 300, "quantity": 15, "returned_quantity": 0}, {"sale_id": 9, "sale_date": "2026-09-01", "product_id": 9, "product_name": "充電器", "category": "行動配件", "channel": "網路商店", "unit_price": 700, "quantity": 8, "returned_quantity": 1}, {"sale_id": 10, "sale_date": "2026-09-01", "product_id": 10, "product_name": "筆電支架", "category": "電腦周邊", "channel": "實體門市", "unit_price": 800, "quantity": 19, "returned_quantity": 0}, {"sale_id": 11, "sale_date": "2026-09-02", "product_id": 1, "product_name": "無線滑鼠", "category": "電腦周邊", "channel": "校園團購", "unit_price": 500, "quantity": 17, "returned_quantity": 0}, {"sale_id": 12, "sale_date": "2026-09-02", "product_id": 2, "product_name": "機械鍵盤", "category": "電腦周邊", "channel": "網路商店", "unit_price": 1200, "quantity": 10, "returned_quantity": 0}, {"sale_id": 13, "sale_date": "2026-09-02", "product_id": 3, "product_name": "USB集線器", "category": "電腦周邊", "channel": "實體門市", "unit_price": 650, "quantity": 3, "returned_quantity": 0}, {"sale_id": 14, "sale_date": "2026-09-02", "product_id": 4, "product_name": "藍牙耳機", "category": "影音設備", "channel": "校園團購", "unit_price": 1800, "quantity": 14, "returned_quantity": 0}, {"sale_id": 15, "sale_date": "2026-09-02", "product_id": 5, "product_name": "藍牙喇叭", "category": "影音設備", "channel": "網路商店", "unit_price": 1500, "quantity": 7, "returned_quantity": 0}, {"sale_id": 16, "sale_date": "2026-09-02", "product_id": 6, "product_name": "網路攝影機", "category": "影音設備", "channel": "實體門市", "unit_price": 1100, "quantity": 18, "returned_quantity": 0}, {"sale_id": 17, "sale_date": "2026-09-02", "product_id": 7, "product_name": "行動電源", "category": "行動配件", "channel": "校園團購", "unit_price": 900, "quantity": 11, "returned_quantity": 0}, {"sale_id": 18, "sale_date": "2026-09-02", "product_id": 8, "product_name": "手機支架", "category": "行動配件", "channel": "網路商店", "unit_price": 300, "quantity": 4, "returned_quantity": 1}, {"sale_id": 19, "sale_date": "2026-09-02", "product_id": 9, "product_name": "充電器", "category": "行動配件", "channel": "實體門市", "unit_price": 700, "quantity": 15, "returned_quantity": 0}, {"sale_id": 20, "sale_date": "2026-09-02", "product_id": 10, "product_name": "筆電支架", "category": "電腦周邊", "channel": "校園團購", "unit_price": 800, "quantity": 8, "returned_quantity": 0}];
            const categoryData = [{"category": "影音設備", "quantity": 1035}, {"category": "行動配件", "quantity": 1017}, {"category": "電腦周邊", "quantity": 1392}];
            const channelData = [{"channel": "實體門市", "quantity": 1144}, {"channel": "校園團購", "quantity": 1160}, {"channel": "網路商店", "quantity": 1140}];

            document.getElementById('debugInfo').innerHTML = '<b>✅ 資料載入成功！包含多維度分析圖表</b>';

            // 1. 折線圖
            new Chart(document.getElementById('lineChart'), {
                type: 'line',
                data: {
                    labels: trendData.map(d => d.sale_date),
                    datasets: [{ label: '銷售數量', data: trendData.map(d => d.quantity), borderColor: '#2563eb', fill: true, backgroundColor: 'rgba(37,99,235,0.1)' }]
                },
                options: { responsive: true }
            });

            // 2. 長條圖
            new Chart(document.getElementById('barChart'), {
                type: 'bar',
                data: {
                    labels: trendData.map(d => d.sale_date),
                    datasets: [{ label: '數量', data: trendData.map(d => d.quantity), backgroundColor: '#10b981' }]
                },
                options: { responsive: true }
            });

            // 3. 甜甜圈圖 (管道占比)
            new Chart(document.getElementById('doughnutChart'), {
                type: 'doughnut',
                data: {
                    labels: channelData.map(d => d.channel),
                    datasets: [{
                        data: channelData.map(d => d.quantity),
                        backgroundColor: ['#f59e0b', '#3b82f6', '#ec4899', '#8b5cf6', '#10b981']
                    }]
                },
                options: { responsive: true }
            });

            // 4. 極區/類別圖
            new Chart(document.getElementById('categoryChart'), {
                type: 'polarArea',
                data: {
                    labels: categoryData.map(d => d.category),
                    datasets: [{
                        data: categoryData.map(d => d.quantity),
                        backgroundColor: ['rgba(239,68,68,0.7)', 'rgba(59,130,246,0.7)', 'rgba(16,185,129,0.7)', 'rgba(245,158,11,0.7)']
                    }]
                },
                options: { responsive: true }
            });

        } catch(e) {
            document.getElementById('debugInfo').innerText = '❌ 錯誤: ' + e.message;
        }
    </script>
</body>
</html>
